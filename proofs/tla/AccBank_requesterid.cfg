\*
\* THE REFUTED DESIGN — every hardware guard deleted at once
\* (DisabledGuards = AllGuardsDeleted).  What remains is precisely the
\* implicit "requester ID" contract spec §23.1 records as refuted: the bank
\* is chosen by the pcid[1:0] slice and the accumulator's owner is INFERRED
\* from whoever happens to be dispatching, rather than DECLARED and
\* enforced.
\*
\* TLC MUST FAIL.  Only Inv_Value is checked, forcing BFS all the way to a
\* state in which a stream has actually DRAINED a corrupted accumulator: a
\* well-formed value that is simply the wrong one, with no fault raised
\* anywhere.  That is the silent-gradient-corruption class end to end.
\*
\* NOTE this run cannot attribute the failure to any single guard — that is
\* what the seven AccBank_del_*.cfg runs are for.  It exists as the
\* narrative refutation of the §23.1 "requester ID" design.
\*
\* Run: tlc -config AccBank_requesterid.cfg AccBank.tla

SPECIFICATION Spec

CONSTANT Streams <- StreamsDefault
CONSTANT Pcid    <- PcidDefault
CONSTANT NBanks  = 2
CONSTANT K       = 2
CONSTANT NSlots  = 2
CONSTANT DisabledGuards <- AllGuardsDeleted

INVARIANT Inv_Value
