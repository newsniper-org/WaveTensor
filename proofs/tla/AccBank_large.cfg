\*
\* GOOD model, LARGER CONFIG — scale check on the small-config result.
\* TLC MUST report "Model checking completed. No error has been found."
\*
\*   Streams = 4, and BOTH banks are contended:
\*             sA/sB alias onto bank 0 (Pcid 0, 2), sC/sD alias onto bank 1
\*             (Pcid 1, 3).  The minimal config leaves bank 1 uncontended.
\*   K       = 3   — one more contribution than the minimum, so a foreign
\*                   event can land at three distinct points in a stream.
\*   NSlots  = 2   — both spill slots contended by four streams.
\*
\* SAFETY ONLY — no PROPERTY lines.  Temporal checking of five strong-
\* fairness obligations across four streams did not terminate in a
\* practical time at this size, so liveness is verified ONLY at the small
\* config (AccBank.cfg).  Recorded honestly rather than left implied.
\*
\* Run: tlc -config AccBank_large.cfg AccBank.tla

SPECIFICATION Spec

CONSTANT Streams <- StreamsLarge
CONSTANT Pcid    <- PcidLarge
CONSTANT NBanks  = 2
CONSTANT K       = 3
CONSTANT NSlots  = 2
CONSTANT DisabledGuards <- NoDeletions

INVARIANT TypeOK
INVARIANT NoSilentAliasing
INVARIANT Inv_Exclusive
INVARIANT Inv_OwnerAgreement
INVARIANT Inv_NoPhantom
INVARIANT Inv_Canonical
INVARIANT Inv_Complete
INVARIANT Inv_NoCrossContextLeak
INVARIANT Inv_Value
