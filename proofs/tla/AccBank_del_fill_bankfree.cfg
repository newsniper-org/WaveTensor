\*
\* GUARD-DELETION EXPERIMENT: "fill_bankfree" (Fill's live bank-free check).
\* TLC MUST FAIL: a fill lands on top of a bank that a foreign aliased
\* stream currently owns live, silently re-pointing the ownership register
\* while the incumbent still believes it owns the bank.
\* Expected counterexample: Inv_OwnerAgreement violated.
\*
\* Run: tlc -config AccBank_del_fill_bankfree.cfg AccBank.tla

SPECIFICATION Spec

CONSTANT Streams <- StreamsDefault
CONSTANT Pcid    <- PcidDefault
CONSTANT NBanks  = 2
CONSTANT K       = 2
CONSTANT NSlots  = 2
CONSTANT DisabledGuards <- DelFillBankFree

INVARIANT Inv_OwnerAgreement
