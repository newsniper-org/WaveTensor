\*
\* GUARD-DELETION EXPERIMENT: "commit_zero" (the acquire-time zero inside
\* CommitOwn — the atomic half of 0x7E FP_ACC_ZERO).
\* TLC MUST FAIL: under SRAM semantics a released bank retains the previous
\* owner's stale partials; without the acquire-time zero the new owner's
\* contributions fold on top of them.
\* Expected counterexample: NoSilentAliasing violated (a mixture term).
\*
\* Run: tlc -config AccBank_del_commit_zero.cfg AccBank.tla

SPECIFICATION Spec

CONSTANT Streams <- StreamsDefault
CONSTANT Pcid    <- PcidDefault
CONSTANT NBanks  = 2
CONSTANT K       = 2
CONSTANT NSlots  = 2
CONSTANT DisabledGuards <- DelCommitZero

INVARIANT NoSilentAliasing
