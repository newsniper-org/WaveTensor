\*
\* GUARD-DELETION EXPERIMENT: "fill_owner" (Fill's image-owner check).
\* TLC MUST FAIL: with two spill slots occupied by two different contexts,
\* a fill that addresses the FOREIGN slot restores another context's
\* partials into its own bank and the leak propagates onward (spill or
\* drain of the stolen image).
\* Expected counterexample: Inv_NoCrossContextLeak violated.
\*
\* Run: tlc -config AccBank_del_fill_owner.cfg AccBank.tla

SPECIFICATION Spec

CONSTANT Streams <- StreamsDefault
CONSTANT Pcid    <- PcidDefault
CONSTANT NBanks  = 2
CONSTANT K       = 2
CONSTANT NSlots  = 2
CONSTANT DisabledGuards <- DelFillOwner

INVARIANT Inv_NoCrossContextLeak
