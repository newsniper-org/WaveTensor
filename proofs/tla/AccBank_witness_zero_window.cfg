\*
\* HAZARD-REACHABILITY WITNESS — TLC MUST FAIL this run (good model).
\* Proves the ZERO-RACE WINDOW is genuinely open in the good model: a
\* context can issue a raw 0x7E FP_ACC_ZERO while a FOREIGN aliased owner
\* holds a non-empty live accumulation in the targeted bank.  This is the
\* trigger state of ZeroFault — and, with "zero_owner" deleted
\* (AccBank_del_zero_owner.cfg), the exact state from which the zero-race
\* counterexample fires.  Together the two runs are the measured basis for
\* the recommendation "acquire+zero must be one atomic event, and a raw
\* 0x7E must be ownership-checked in hardware".
\*
\* Run: tlc -config AccBank_witness_zero_window.cfg AccBank.tla

SPECIFICATION Spec

CONSTANT Streams <- StreamsDefault
CONSTANT Pcid    <- PcidDefault
CONSTANT NBanks  = 2
CONSTANT K       = 2
CONSTANT NSlots  = 2
CONSTANT DisabledGuards <- NoDeletions

INVARIANT Witness_NoZeroRaceWindow
