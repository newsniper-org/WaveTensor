\*
\* GOOD model — the proposed explicit ownership/drain contract, all guards
\* armed (DisabledGuards = {}).
\* TLC MUST report "Model checking completed. No error has been found."
\*
\* Constants are sized for a fully exhaustive BFS, not sampled:
\*   Streams = 3, of which sA and sB ALIAS onto bank 0 (Pcid 0 and 2, and
\*             BankOf(p) = p % 2), sC owns bank 1.
\*   NBanks  = 2   — the spec's actual bank count (§23.1).
\*   K       = 2   — two contributions per stream is the minimum that can
\*                   exhibit an interleaved write-write alias (one landing
\*                   before and one after a foreign event).
\*   NSlots  = 2   — the minimum at which the cross-context spill/fill
\*                   hazard is reachable (measured; 1 slot made it vacuous).

SPECIFICATION Spec

CONSTANT Streams <- StreamsDefault
CONSTANT Pcid    <- PcidDefault
CONSTANT NBanks  = 2
CONSTANT K       = 2
CONSTANT NSlots  = 2
CONSTANT DisabledGuards <- NoDeletions

INVARIANT TypeOK
INVARIANT NoSilentAliasing
INVARIANT Inv_Exclusive
INVARIANT Inv_OwnerAgreement
INVARIANT Inv_NoPhantom
INVARIANT Inv_Canonical
INVARIANT Inv_Complete
INVARIANT Inv_NoCrossContextLeak
INVARIANT Inv_Value

PROPERTY Liveness
PROPERTY NoOwnershipLeak
