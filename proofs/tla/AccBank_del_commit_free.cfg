\*
\* GUARD-DELETION EXPERIMENT: "commit_free" (CommitOwn's live bank-free
\* check; its fault path RejectOwn disappears with it).
\* TLC MUST FAIL: a second claim STEALS a live bank instead of being
\* refused, and the incumbent still believes it is the owner.
\* Expected counterexample: Inv_OwnerAgreement violated.
\*
\* Run: tlc -config AccBank_del_commit_free.cfg AccBank.tla

SPECIFICATION Spec

CONSTANT Streams <- StreamsDefault
CONSTANT Pcid    <- PcidDefault
CONSTANT NBanks  = 2
CONSTANT K       = 2
CONSTANT NSlots  = 2
CONSTANT DisabledGuards <- DelCommitFree

INVARIANT Inv_OwnerAgreement
