\*
\* GUARD-DELETION EXPERIMENT: "zero_owner" — THE ZERO RACE.
\* This is 0x7E FP_ACC_ZERO taken literally as the ISA row reads: a plain
\* zeroing op, no ownership check, not fused with acquire.
\* TLC MUST FAIL: a foreign raw 0x7E lands mid-accumulation, guts the
\* incumbent's partials, and the incumbent later drains a well-formed value
\* that is silently wrong (an "honest-looking 0.0" in fp32 terms) — with no
\* fault raised anywhere.
\* Expected counterexample: Inv_Value violated.
\*
\* Run: tlc -config AccBank_del_zero_owner.cfg AccBank.tla

SPECIFICATION Spec

CONSTANT Streams <- StreamsDefault
CONSTANT Pcid    <- PcidDefault
CONSTANT NBanks  = 2
CONSTANT K       = 2
CONSTANT NSlots  = 2
CONSTANT DisabledGuards <- DelZeroOwner

INVARIANT Inv_Value
