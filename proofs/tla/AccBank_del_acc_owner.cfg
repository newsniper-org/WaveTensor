\*
\* GUARD-DELETION EXPERIMENT: "acc_owner" (Accumulate's owner check).
\* TLC MUST FAIL: a stray VFMA_ACC still in flight after 0x7D SPILL lands
\* in a bank now owned by an aliased stream, mixing two streams'
\* contributions in one physical cell.
\* Expected counterexample: NoSilentAliasing violated.
\*
\* Run: tlc -config AccBank_del_acc_owner.cfg AccBank.tla

SPECIFICATION Spec

CONSTANT Streams <- StreamsDefault
CONSTANT Pcid    <- PcidDefault
CONSTANT NBanks  = 2
CONSTANT K       = 2
CONSTANT NSlots  = 2
CONSTANT DisabledGuards <- DelAccOwner

INVARIANT NoSilentAliasing
