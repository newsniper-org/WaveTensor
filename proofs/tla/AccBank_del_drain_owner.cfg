\* GUARD-DELETION EXPERIMENT: "drain_owner" (Drain's owner check).
\* TLC MUST FAIL: a stray drain still in flight after 0x7D SPILL reads out
\* ANOTHER context's live partial accumulation — a cross-context data leak,
\* not merely corruption.
\* Expected counterexample: Inv_NoCrossContextLeak violated.
\*
\* Run: tlc -config AccBank_del_drain_owner.cfg AccBank.tla

SPECIFICATION Spec

CONSTANT Streams <- StreamsDefault
CONSTANT Pcid    <- PcidDefault
CONSTANT NBanks  = 2
CONSTANT K       = 2
CONSTANT NSlots  = 2
CONSTANT DisabledGuards <- DelDrainOwner

INVARIANT Inv_NoCrossContextLeak
