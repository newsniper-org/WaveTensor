\* MUST FAIL: Prop_NoReMiss — 짝: 오늘의 RTL (W2 전 RTL — HEAD 9b6eee6: HiuPipeline missWait = s3.valid ∧ ¬조회 적중 — 래치 없음) = verdict_latch 를 지운 판을 HostSpec(관측면만 보는 호스트 + 경쟁 커밋자) 아래에서 돌린다. 정지 → 호스트 채움으로 풀림 → hold 로 조회 지점에 머묾 → 같은 파티션 다른 VPN 의 경쟁 커밋이 축출 → 다시 미적중 (03-hiu.typ 3.9 판정 래치 행의 반례 꼴). BFS 최단 반례는 경쟁 커밋의 축출을 풀린 사이클(첫 적중) 끝 에지에 둔다 — 모델의 관대한 인터리빙(모델 머리 「원자성」 2)이고 RTL 에서는 그 에지가 같은 파티션 커밋을 받지 않는다(채움 슬롯 점유). RTL 에서 가능한 꼴은 hold ≥ 2 사이클 뒤의 경쟁 커밋이다(수락 C → C+1 바이패스 적중 · 슬롯 해제 → C+2 경쟁 수락 → C+3 가림으로 재미적중) — 끝-끝 음성 대조는 그 꼴을 쓴다.
CONSTANTS
  Parts = {p1, p2}
  Vpns = {v1, v2}
  Frames = {f1, f2}
  NoPart = NoPart
  NoVpn = NoVpn
  NoFr = NoFr
  ObsNoStall = "latched"
  Pipe = "uniform"
  Wired = TRUE
  Alts = {}
  DisabledGuards = {"verdict_latch"}
SPECIFICATION HostSpec
PROPERTY Prop_NoReMiss
