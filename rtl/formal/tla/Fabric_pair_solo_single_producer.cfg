\* 짝 run — "single_producer" 를 지우되 *경합 없는* 형상. TLC 는 **반드시 통과**해야 한다.
\* 대기자가 하나뿐이면 이 가드는 막을 것이 없으므로 지워도 아무 일도 일어나지 않는다.
\* Fabric_del_valid_gated_solo.cfg 와 짝으로 읽어야 두 가드가 서로 다른 결함형임이 확정된다 —
\* 같은 제약 아래에서 하나는 깨지고 하나는 깨지지 않는다.
CONSTANTS
  NumProducers = 2
  Bits = {b1, b2}
  NoVal = NoVal
  D = 1
  DisabledGuards = {"single_producer"}
SPECIFICATION Spec
CONSTRAINT Witness_NoContention
INVARIANT TypeOK
INVARIANT Inv_SingleValidProducer
INVARIANT Inv_MergeFaithful
