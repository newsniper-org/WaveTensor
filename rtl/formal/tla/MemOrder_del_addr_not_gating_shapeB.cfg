\* 형상 sweep — 연산 수 확장 (NOps = 4). 이어진 쌍과 잇지 않은 쌍이 각각 둘씩 공존한다.
\* MUST FAIL: Inv_OnlyTokenBlocks — §4.4.4 규범 2 「같은 주소여도」.
\* 지우면 같은 주소 접근이 프로그램 순서로 자동 직렬화된다. 구현이 정본이
\* 명시적으로 열어 둔 자유를 *스스로 반납하는* 형태이며, §4.4.4 해설이
\* 영역 분할을 「이 기전 위의 최적화」로 되돌린 이상 가장 그럴듯한 과잉
\* 게이팅이다.
\*
\* 1차 판에는 이 가드가 없었다 — addr 가 증인 안에서만 읽히고 발화 게이트
\* 어디에도 없어 이 결함형이 *표현 불가*였다 (README 교훈 ②).
\* 짝: MemOrder_pair_addr_freedom_lost.cfg (자유 소멸) ·
\*     MemOrder_pair_addr_wave_axis.cfg (wave 축은 생존 — 국소성 확인)
CONSTANTS
  NOps = 4
  NWaves = 2
  NAddr = 2
  DisabledGuards = {"addr_not_gating"}
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT Inv_OnlyTokenBlocks
