\* MUST FAIL: Prop_HiCommits — 같은 짝 삭제(오늘의 RTL)의 항목 배열 쪽. 호스트의 항목 기입이 사라져 E.3 2항 「정지를 푸는 것은 항목 기입뿐」이 이행 불가능해진다.
CONSTANTS
  Parts = {p1, p2}
  Indices = {i1}
  Frames = {f1, f2}
  Junk = Junk
  Phantom = Phantom
  Refusal = "stall"
  DisabledGuards = {"hi_fires", "flush_fires", "reject_loud"}
SPECIFICATION Spec
INVARIANT TypeOK
PROPERTY Prop_HiCommits
