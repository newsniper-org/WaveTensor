\* MUST FAIL: Prop_NoSilentOverwrite — 짝: 오늘의 RTL, poison 축만 켬(Traces = {0}). poison 은 값마다
\* 장치가 저작하므로 한 조각열 안에서 조각마다 다를 수 있다 — 전량 비교는 poison 든 조각을 새 문맥으로
\* 보내 「poison 은 흐름을 바꾸지 않는다」(01-isa-asm 1.4.4 3항)를 어기고 같은 덮어쓰기를 낸다.
CONSTANTS
  NumTags = 2
  Runs = {r1, r2}
  Ctxs = {x1, x2}
  SlotCap = 2
  MaxSend = 4
  NoR = NoR
  NoT = NoT
  Traces = {0}
  Poisons = {0, 1}
  DisabledGuards = {"key_drops_side"}
SPECIFICATION Spec
INVARIANT TypeOK
PROPERTY Prop_NoSilentOverwrite
