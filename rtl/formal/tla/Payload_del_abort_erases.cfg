\* MUST FAIL: Inv_ReassemblyExclusive — 가드 삭제: abort_erases. 소거가 태그를
\* 해방하고 구간은 비우되 *회계*(수신 순번 집합·접수 개수·소유 조각열·표시)를
\* 남긴다 — 낡은 표시와 개수가 새 조각열 하나에 얹혀 완성 판정이 서고, 비워진
\* 구간이 그대로 결과로 나간다 (앞 칸이 NoR 인 「결과」).
\*
\* 2026-08-25 분리 이전에는 이 실험이 회계와 구간을 *함께* 지웠고 위반 속성은
\* Prop_NoSilentOverwrite 였다. 분리 실측이 드러낸 것: 그 반례는 전부 *구간*
\* 축이 만들고 있었고 회계 축은 한 번도 독립으로 재어진 적이 없었다. 그것이
\* 모델 머리가 Consume/ContextAbort 를 가른 근거 — 「한 가드로 묶으면 한쪽
\* 경로만 깨진 구현이 구별 불가」 — 와 같은 부류의 결함이며, 실제로 RTL 이
\* 정확히 그 「한쪽만 깨진 구현」이었다 (회계는 비우고 구간은 안 비움).
CONSTANTS
  NumTags = 2
  Runs = {r1, r2}
  Ctxs = {x1, x2}
  SlotCap = 2
  MaxSend = 4
  NoR = NoR
  NoT = NoT
  DisabledGuards = {"abort_erases"}
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT Inv_ReassemblyExclusive
