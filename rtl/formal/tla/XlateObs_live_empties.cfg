\* 대비 (MUST FAIL): 좋은 모델 · HostSpec 에서 「조회 지점이 언젠가 빈다」(Prop_StallEmpties — Stalled ~> ~s3.on)는 깨진다 — 연속 전진(LeaveArrive)이 정상 흐름이라 요청이 끊임없이 이어지면 s3 가 영영 비지 않는다. 그래서 진행 Prop_StallResolves 를 요청 꼬리표 tok 로 적었다 (모델 머리 「발견 (W2 독립 반증)」).
CONSTANTS
  Parts = {p1, p2}
  Vpns = {v1, v2}
  Frames = {f1, f2}
  NoPart = NoPart
  NoVpn = NoVpn
  NoFr = NoFr
  ObsNoStall = "latched"
  Pipe = "uniform"
  Wired = TRUE
  Alts = {}
  DisabledGuards = {}
SPECIFICATION HostSpec
PROPERTY Prop_StallEmpties
