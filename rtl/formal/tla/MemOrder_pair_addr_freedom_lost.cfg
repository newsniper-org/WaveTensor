\* MUST PASS — *자유가 사라졌다는 것의 형식.*
\* addr_not_gating 을 지운 모델에서 Witness_NoAddrInversion 이 *통과*한다:
\* 같은 주소를 쓰는 잇지 않은 쌍이 더 이상 프로그램 순서를 거스를 수 없다.
\*
\* 좋은 모델에서 MUST FAIL 인 증인이 여기서 MUST PASS 인 것이 짝의 내용이다.
\* 이 두 run 이 없으면 「addr_not_gating 이 규범 2의 자유를 지탱한다」는
\* 진술이 서지 않는다 — 삭제로 불변식이 깨지는 것만으로는 *어느 자유가*
\* 사라졌는지 말할 수 없기 때문이다.
CONSTANTS
  NOps = 3
  NWaves = 2
  NAddr = 2
  DisabledGuards = {"addr_not_gating"}
SPECIFICATION Spec
INVARIANT Witness_NoAddrInversion
