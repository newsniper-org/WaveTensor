\* MUST FAIL: Witness_NoMarkerLoss — 위험 도달성 증인: 표시 유실 갈래가 실제로
\* 도달한다 — 생산이 끝났는데 표시 없는 미완 문맥이 남았고 기계는 fault 를
\* 세우지 않았다. 반증되지 않으면 「미완은 fault 가 아니다 — 처분은 호스트
\* 몫」 이라는 갈래가 시험된 적 없는 장식이다.
CONSTANTS
  NumTags = 2
  Runs = {r1, r2}
  Ctxs = {x1, x2}
  SlotCap = 2
  MaxSend = 4
  NoR = NoR
  NoT = NoT
  DisabledGuards = {}
SPECIFICATION Spec
INVARIANT Witness_NoMarkerLoss
