\* MUST FAIL: Prop_FlushClears — 짝 삭제: flush_fires + reject_loud = 오늘의 RTL 의 0xE00 쪽(적법한 flush 도, 없는 값·예약 위반 flush 도 조용히 흡수). 임대 회전 ⑵ 의 XLATE_FLUSH 가 사라진다 — 파도 2 의 T1. 항목은 HI 문으로 세운다 — 오늘의 RTL 에서 항목이 서는 유일한 길인 최상위 io.install 의 대역이다. hi_fires 까지 지우면 표에 산 항목이 하나도 없어 이 짝이 공허하게 통과한다(실측) — 문을 둘 다 지운 모델에서 flush 결함은 보이지 않는다.
CONSTANTS
  Parts = {p1, p2}
  Indices = {i1}
  Frames = {f1, f2}
  Junk = Junk
  Phantom = Phantom
  Refusal = "stall"
  StgAlt = "flush"
  BelowCap = FALSE
  DisabledGuards = {"flush_fires", "reject_loud"}
SPECIFICATION Spec
INVARIANT TypeOK
PROPERTY Prop_FlushClears
