\* MUST FAIL: Prop_LatchedSurvivesRetract — 고정 속성의 반증: 래치 없는 판(verdict_latch 삭제)에서 판정 뒤의 커밋(같은 VPN 의 다른 값 재커밋 · 철회 뒤 재채움)이 떠나는 값을 바꾼다 — 판정 시점의 스냅샷을 들고 가지 않는다.
CONSTANTS
  Parts = {p1, p2}
  Vpns = {v1, v2}
  Frames = {f1, f2}
  NoPart = NoPart
  NoVpn = NoVpn
  NoFr = NoFr
  ObsNoStall = "latched"
  Pipe = "uniform"
  Wired = TRUE
  Alts = {}
  DisabledGuards = {"verdict_latch"}
SPECIFICATION Spec
INVARIANT TypeOK
PROPERTY Prop_LatchedSurvivesRetract
