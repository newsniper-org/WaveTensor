\* MUST PASS — 좋은 모델, *주소 축 확장* 형상 (NAddr = 3).
\* 세 연산이 서로 다른 주소에 있을 수 있는 첫 형상이다 — NAddr = 2 에서는
\* 셋 중 둘은 반드시 같은 주소를 공유한다. addr_not_gating 삭제 실험이
\* 「주소가 겹치지 않으면 직렬화도 없다」를 시험하려면 이 형상이 필요하다.
CONSTANTS
  NOps = 3
  NWaves = 2
  NAddr = 3
  DisabledGuards = {}
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT Inv_DepRespected
INVARIANT Inv_ObservedOrder
INVARIANT Inv_OnlyTokenBlocks
INVARIANT Inv_CompleteUngated
INVARIANT Inv_NoCircularWait
