\* 가드 삭제 실험: "entitle_gates_value" — 승인(granted)에서 자격 항이 빠져, 자격 거부 장치 접근(거부 채움이 전형)이 값을 돌려받고 쓰기가 반영된다. [4] 는 그대로 서므로 보고 축 속성은 이것을 못 본다. TLC 는 반드시 실패해야 한다.
CONSTANTS
  Pages = {p1}
  Vaddrs = {v1}
  NoMap = NoMap
  NoCache = NoCache
  NoVal = NoVal
  DisabledGuards = {"entitle_gates_value"}
  SetShape = "any"
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT Inv_EntDeniedBlocked
