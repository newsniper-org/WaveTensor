\* 진행 — 관측면만 보고 항목을 기입하는 호스트(HostSpec — W2 부터 경쟁자(정지 중인 요청의 항목 밖의 V=1 · V=0 COMMIT — 같은 파티션 축출 포함 — 과 flush) · 하류 배압 · 연속 전진 포함) 아래 정지한 *그* 요청(요청 꼬리표 tok)은 결국 풀려 조회 지점을 떠난다 (채널의 충분성 · e-defined.typ:881 「채널이 없으면 2항은 이행 불가능한」 · 결과 (h) 의 수렴).
