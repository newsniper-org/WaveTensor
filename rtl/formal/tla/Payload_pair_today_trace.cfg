\* MUST FAIL: Prop_NoSilentOverwrite — 짝: 오늘의 RTL (Reassembly 번들 통비교 = key_drops_side 삭제),
\* trace 축만 켬(Poisons = {0}). 조각 조회 절반의 호스트 가시 귀결 — trace 만 다른 도착이 같은 키의
\* 둘째 문맥을 열고 같은 구간에 기입해 다른 조각열의 칸을 조용히 덮는다 (04-ext-payload 4.3 함정의 재발).
CONSTANTS
  NumTags = 2
  Runs = {r1, r2}
  Ctxs = {x1, x2}
  SlotCap = 2
  MaxSend = 4
  NoR = NoR
  NoT = NoT
  Traces = {0, 1}
  Poisons = {0}
  DisabledGuards = {"key_drops_side"}
SPECIFICATION Spec
INVARIANT TypeOK
PROPERTY Prop_NoSilentOverwrite
