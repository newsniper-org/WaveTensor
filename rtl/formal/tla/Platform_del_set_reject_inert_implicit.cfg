\* 고정 속성 상주 음성 (W6): set_reject_inert 를 지운 같은 판 — 축출된 페이지가 전이 기입 없이 소유를 잃는다. TLC 는 반드시 Prop_NoImplicitTransition 으로 실패해야 한다.
CONSTANTS
  Pages = {p1, p2}
  Vaddrs = {v1}
  NoMap = NoMap
  NoCache = NoCache
  NoVal = NoVal
  DisabledGuards = {"set_reject_inert"}
  SetShape = "any"
SPECIFICATION Spec
INVARIANT TypeOK
PROPERTY Prop_NoImplicitTransition
