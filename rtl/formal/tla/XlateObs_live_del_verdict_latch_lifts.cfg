\* 대비 (MUST PASS): 같은 라이브락 판(verdict_latch 삭제 · HostSpec)이 옛 진행 꼴 Prop_StallLifts(Stalled ~> ~Stalled)는 통과한다 — 매 정지가 순간이나마 풀리기 때문이다. 그래서 Prop_StallResolves 를 「정지한 *그* 요청은 결국 떠난다」(요청 꼬리표 tok — (Stalled ∧ tok = b) ~> (¬s3.on ∨ tok ≠ b))로 강화했다 (모델 머리 「발견 (W2)」 · 「발견 (W2 독립 반증)」).
CONSTANTS
  Parts = {p1, p2}
  Vpns = {v1, v2}
  Frames = {f1, f2}
  NoPart = NoPart
  NoVpn = NoVpn
  NoFr = NoFr
  ObsNoStall = "latched"
  Pipe = "uniform"
  Wired = TRUE
  Alts = {}
  DisabledGuards = {"verdict_latch"}
SPECIFICATION HostSpec
PROPERTY Prop_StallLifts
