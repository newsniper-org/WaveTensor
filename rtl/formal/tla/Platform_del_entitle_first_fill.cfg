\* 가드 삭제 실험: "entitle_first" 의 거부 채움 축 — 거부 채움(perm = {})된 비소유 프레임 접근이 [4] 만이 아니라 [19] 도 세운다 (회수 페이지가 전형). TLC 는 반드시 실패해야 한다.
CONSTANTS
  Pages = {p1}
  Vaddrs = {v1}
  NoMap = NoMap
  NoCache = NoCache
  NoVal = NoVal
  DisabledGuards = {"entitle_first"}
  SetShape = "any"
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT Inv_DenyFillIs4
