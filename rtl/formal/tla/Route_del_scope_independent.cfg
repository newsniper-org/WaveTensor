\* 기저 — 깊이 2. 계층이 둘일 때 「범위마다 1회」가 실질이 된다.
CONSTANTS
  Names = {n1, n2, n3, n4}
  Banks = {b1, b2}
  Points = {d1, d2}
  Depth = 2
  NoName = NoName
  DisabledGuards = {"scope_independent"}
SPECIFICATION Spec
\* 앞 범위의 결과가 이 범위 판정에 샌다 — 깊이 귀납이 무너진다
INVARIANT TypeOK
INVARIANT Inv_ScopeLocal
