\* 가드 삭제 실험: "valid_gated" — *경합 없는* 형상. TLC 는 **반드시 실패**해야 한다.
\* CONSTRAINT 로 「두 생산자가 동시에 대기하는 일이 없다」를 강제한 상태에서도 깨진다는 것이,
\* 이 가드가 single_producer 와 *독립적으로* 필요하다는 증명이다. 1차 판에서는 이 run 이
\* 조용히 통과했고 — 생성 상태 수까지 좋은 모델과 같았다 — 두 가드가 사실상 한 결함형이었다.
CONSTANTS
  NumProducers = 2
  Bits = {b1, b2}
  NoVal = NoVal
  DisabledGuards = {"valid_gated"}
SPECIFICATION Spec
CONSTRAINT Witness_NoContention
INVARIANT TypeOK
INVARIANT Inv_SingleValidProducer
