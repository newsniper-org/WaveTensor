\* MUST FAIL: Inv_DepRespected — 토큰 게이트가 §4.4.4 규범 1을 지탱한다.
\* 지우면 기계가 토큰을 기다리지 않고 발화한다 = *과소 게이팅*. 이어진 쌍의
\* 뒤 연산이 앞 연산의 완료 전에 발화한다 — 발화 계약(Inv_DepRespected)
\* 위반. 관측 계약(Inv_ObservedOrder)은 _del_token_on_complete 계열의 몫이다.
CONSTANTS
  NOps = 3
  NWaves = 2
  NAddr = 2
  DisabledGuards = {"token_gate"}
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT Inv_DepRespected
