\* MUST PASS — 좋은 모델(가드 전부 켬), 기저 형상. 불변식 열 + 행위 속성 전부.
\* Tags 정제 축 중 trace 를 켠다 — Traces = {0, 1} · Poisons = {0} (태그 코덱 전파 파도 · D2b).
\* 두 비트를 함께 켜면 전이 분기가 4배라 기저가 실측 폭발한다(2026-09-26: 약 2분에 depth 6 · 29만
\* distinct 에서 끊음 — trace 만 켠 판은 39.8만 distinct 1분 30초). poison 축은 짝 판
\* Payload_side_poison.cfg 가 같은 속성으로 잰다 — 모델에서 두 비트는 같은 자리(키 밖 · 소거는 0)라
\* 한 축씩 켜도 매칭의 두 절반이 각 비트로 한 번씩 시험된다.
CONSTANTS
  NumTags = 2
  Runs = {r1, r2}
  Ctxs = {x1, x2}
  SlotCap = 2
  MaxSend = 4
  NoR = NoR
  NoT = NoT
  Traces = {0, 1}
  Poisons = {0}
  DisabledGuards = {}
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT Inv_ReassemblyExclusive
INVARIANT Inv_NoCrossWindow
INVARIANT Inv_RejectLoud
INVARIANT Inv_CapabilityNotMalformed
INVARIANT Inv_NoStaleRedeliver
INVARIANT Inv_EndIncompleteLoud
INVARIANT Inv_AbortLoud
INVARIANT Inv_AbortNotFault
INVARIANT Inv_AbortReachesKey
PROPERTY Prop_NoSilentOverwrite
