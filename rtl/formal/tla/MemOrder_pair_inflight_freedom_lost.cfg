\* MUST PASS — *동시성이 사라졌다는 것의 형식.*
\* inflight_not_gating 을 지운 모델에서 Witness_NoConcurrentInflight 가
\* *통과*한다: 어느 시점에도 비행 중 연산이 최대 하나다.
\*
\* 좋은 모델에서 MUST FAIL 인 증인이 여기서 MUST PASS 인 것이 짝의 내용이며,
\* 그것이 「단일 미결 파이프」라는 결함형의 형식적 정의다.
CONSTANTS
  NOps = 3
  NWaves = 2
  NAddr = 2
  DisabledGuards = {"inflight_not_gating"}
SPECIFICATION Spec
INVARIANT Witness_NoConcurrentInflight
