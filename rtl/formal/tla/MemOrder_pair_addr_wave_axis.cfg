\* MUST FAIL: Witness_NoWaveInversion — *삭제가 축을 가린다는 확인.*
\* addr_not_gating 을 지워도 wave 축의 자유는 살아 있다.
\*
\* 이것이 없으면 위 _pair_addr_freedom_lost.cfg 의 MUST PASS 가 「addr 축
\* 자유가 사라졌다」가 아니라 「모델이 통째로 죽었다」일 수도 있다.
\* 삭제 실험이 *국소적*임을 보이는 run 이며, 세 과잉 게이팅 축이 서로를
\* 대신하지 않는다는 증거다.
CONSTANTS
  NOps = 3
  NWaves = 2
  NAddr = 2
  DisabledGuards = {"addr_not_gating"}
SPECIFICATION Spec
INVARIANT Witness_NoWaveInversion
