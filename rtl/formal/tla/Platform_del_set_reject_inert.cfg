\* 가드 삭제 실험: "set_reject_inert" (W6) — 거절이 대상을 앉히고 다른 장치 소유 페이지를 축출한다(직접 사상 덮어쓰기). TLC 는 반드시 Prop_SetRejectInert 로 실패해야 한다.
CONSTANTS
  Pages = {p1, p2}
  Vaddrs = {v1}
  NoMap = NoMap
  NoCache = NoCache
  NoVal = NoVal
  DisabledGuards = {"set_reject_inert"}
  SetShape = "any"
SPECIFICATION Spec
INVARIANT TypeOK
PROPERTY Prop_SetRejectInert
