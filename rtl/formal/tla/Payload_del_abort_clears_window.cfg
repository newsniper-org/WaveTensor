\* MUST FAIL: Prop_NoSilentOverwrite — 가드 삭제: abort_clears_window. 소거가
\* 태그를 해방하고 회계를 비우되 *구간 데이터*를 남긴다 — 잔재 위의 재사용이
\* 조용한 덮어쓰기로 나타난다 (같은 자리에 다른 조각열이 앉는다).
\*
\* 이 실험이 2026-08-25 에 신설된 이유가 곧 이 파도의 실물이다. 종전에는
\* abort_erases 하나가 회계와 구간을 함께 쥐고 있었고, 그 삭제 실험의 반례는
\* *전부 구간 축*이 만들고 있었다. 그 사이 RTL 은 「이 모듈은 slots 를
\* 소유하지 않는다」는 근거로 회계만 비우고 있었다 — 즉 모델이 재는 축과 RTL 이
\* 어긋난 축이 서로 어긋나 있었고, 묶인 가드가 그 어긋남을 가렸다.
\*
\* 모델 머리가 Consume 과 ContextAbort 를 가른 근거 — 「한 가드로 묶으면 삭제
\* 실험이 두 경로를 동시에 지워, 한쪽 경로만 깨진 구현이 모델 대응에서 구별
\* 불가가 된다」 — 가 *같은 액션 안의 두 축*에도 그대로 걸린다는 것이 실측된
\* 것이다. 가드 분리의 기준은 전이가 다른가가 아니라 *write-enable 이 다른가*다.
CONSTANTS
  NumTags = 2
  Runs = {r1, r2}
  Ctxs = {x1, x2}
  SlotCap = 2
  MaxSend = 4
  NoR = NoR
  NoT = NoT
  DisabledGuards = {"abort_clears_window"}
SPECIFICATION Spec
INVARIANT TypeOK
PROPERTY Prop_NoSilentOverwrite
