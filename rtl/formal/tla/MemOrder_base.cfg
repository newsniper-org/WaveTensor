\* MUST PASS — 좋은 모델. 여섯 불변식을 전부 건다 (§6.3.2 규약).
\*   Inv_DepRespected     발화 계약 — §4.4.4 규범 1 (과소 게이팅 없음)
\*   Inv_ObservedOrder    관측 계약 — EXT-6 문면 (완료 순서 = 프로그램 순서)
\*   Inv_OnlyTokenBlocks  과잉 게이팅 없음 — §4.4.4 규범 2·3
\*   Inv_CompleteUngated  완료 무게이트 — 완료측 순서 부과 없음
\*   Inv_NoCircularWait   순환 대기 없음 — 과잉 게이팅·오배선의 둘째 대가
\* ⚠️ Inv_OnlyTokenBlocks 는 이 형상에서 *측정된 항진명제*다.
\*    MemOrder_pair_gate_equals_contract.cfg 가 그 사실을 선언한다.
\*    Inv_CompleteUngated 는 좋은 모델에서 *구성상* 참이다 — 내용은
\*    MemOrder_del_complete_not_ordered.cfg 와 증인 짝에서 온다.
CONSTANTS
  NOps = 3
  NWaves = 2
  NAddr = 2
  DisabledGuards = {}
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT Inv_DepRespected
INVARIANT Inv_ObservedOrder
INVARIANT Inv_OnlyTokenBlocks
INVARIANT Inv_CompleteUngated
INVARIANT Inv_NoCircularWait
