\* 가드 삭제 실험: "verdict_latch" — 래치 없음(오늘의 RTL(W2 전 — HEAD 9b6eee6) 모양 — 매 사이클 다시 판정). 판정된 요청이 머무는 동안 그 항목이 철회되거나(BFS 최단 반례 — V=0 COMMIT, 깊이 3) 같은 파티션의 다른 VPN 커밋에 밀려나면(짝 「오늘의 RTL(W2 전 — HEAD 9b6eee6)」의 꼴) 다시 정지한다. 최단 반례는 철회를 첫 적중 사이클 끝 에지에 둔다 — 모델의 관대한 인터리빙(모델 머리 「원자성」 2)이고, RTL 에서 재현되는 꼴은 hold ≥ 2 사이클 뒤의 커밋이다. TLC 는 반드시 실패해야 한다 (자기 속성 Prop_NoReMiss).
CONSTANTS
  Parts = {p1, p2}
  Vpns = {v1, v2}
  Frames = {f1, f2}
  NoPart = NoPart
  NoVpn = NoVpn
  NoFr = NoFr
  ObsNoStall = "latched"
  Pipe = "uniform"
  Wired = TRUE
  Alts = {}
  DisabledGuards = {"verdict_latch"}
SPECIFICATION Spec
INVARIANT TypeOK
PROPERTY Prop_NoReMiss
PROPERTY Prop_StatusStall
PROPERTY Prop_StatusSticky
PROPERTY Prop_PartStalled
PROPERTY Prop_VpnStalled
PROPERTY Prop_NoStallNoData
PROPERTY Prop_ReadPure
PROPERTY Prop_NoInheritedVerdict
PROPERTY Prop_OneValue
