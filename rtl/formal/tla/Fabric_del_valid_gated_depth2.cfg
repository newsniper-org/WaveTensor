\* MUST FAIL: Inv_SingleValidProducer — 가드 삭제 실험: "valid_gated" · 깊이 D=2.
\* 게이팅이 빠진 OR 은 버스면 레지스터에 값이 남은 PE 를 전부 함께 싣는다. 뒤 슬롯은
\* 병합 지점에서 보이지 않으므로 이 결함형은 깊이와 무관하다 — D=2 에서도 같은
\* 불변식이 같은 방식으로 깨져야 한다 (§2.3 규범 2항).
CONSTANTS
  NumProducers = 2
  Bits = {b1, b2}
  NoVal = NoVal
  D = 2
  DisabledGuards = {"valid_gated"}
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT Inv_SingleValidProducer
