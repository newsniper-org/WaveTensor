\* MUST FAIL: Prop_NoInheritedVerdict — 대안 clear_late: 래치 비움이 떠난 *다음* 에지에 선다(RegNext(s3.valid ∧ advance) — 래치 가드 latch_clears_on_leave 의 「같은 에지」를 어긴 그럴듯한 RTL). 연속 전진(LeaveArrive)으로 같은 에지에 들어온 다음 요청이 앞 요청의 판정을 한 사이클 물려받아 미적중인데도 정지하지 않는다 — 그 사이클에 떠나면 앞 요청의 프레임(다른 파티션 것일 수 있다)을 나른다.
CONSTANTS
  Parts = {p1, p2}
  Vpns = {v1, v2}
  Frames = {f1, f2}
  NoPart = NoPart
  NoVpn = NoVpn
  NoFr = NoFr
  ObsNoStall = "latched"
  Pipe = "uniform"
  Wired = TRUE
  Alts = {"clear_late"}
  DisabledGuards = {}
SPECIFICATION Spec
INVARIANT TypeOK
PROPERTY Prop_NoInheritedVerdict
