\* MUST FAIL: Inv_NoCircularWait — 토큰 배선 오류의 *역방향* — 배선 순환 교착.
\* 기계가 *뒤* 색인의 연산을 기다리도록 배선된다 (예: gateOn[1] ∋ 2 ∧
\* gateOn[2] ∋ 1 — 상호 대기). wave·addr 축이 전혀 개입하지 않는 순수 토큰
\* 배선 순환이며, 이 결함형의 고유 서명은 순서 위반이 아니라 *교착*이다.
\*
\* ⚠️ 1차 판은 GateCand 가 전방(a < o)으로 잘려 있어 이 방향이 *표현 불가*
\*    였다 — 「유한하게 둔다」는 주석 근거는 거짓이었다 ([Ops -> SUBSET Ops]
\*    는 제한 없이도 유한하다). 그래서 과소·과대 두 run 은 색인 순서를
\*    지키는 오배선만 시험하고 있었다 (README 교훈 ②).
\* _del_gate_matches_dep.cfg(과소) · _del_gate_matches_dep_over.cfg(과대)와
\* *짝*이다. 배선은 초기 상태에서 정해지므로 위반도 초기 상태에 있다.
\* 정본 환류 대상: §4.4.4 해설의 교착 근거에 「배선 순환도 교착한다」.
CONSTANTS
  NOps = 3
  NWaves = 2
  NAddr = 2
  DisabledGuards = {"gate_matches_dep"}
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT Inv_NoCircularWait
