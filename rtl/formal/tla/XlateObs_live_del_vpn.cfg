\* MUST FAIL: Prop_StallResolves — 진행 짝: VPN 이 첫 미적중 포착 (갈래 (B), obs_vpn_stalled 삭제). 해제 없이 온 둘째 정지를 호스트가 엉뚱한 항목으로 채운다 — 영영 못 푼다.
CONSTANTS
  Parts = {p1, p2}
  Vpns = {v1, v2}
  NoPart = NoPart
  NoVpn = NoVpn
  ObsNoStall = "latched"
  Pipe = "uniform"
  Wired = TRUE
  DisabledGuards = {"obs_vpn_stalled"}
SPECIFICATION HostSpec
PROPERTY Prop_StallResolves
