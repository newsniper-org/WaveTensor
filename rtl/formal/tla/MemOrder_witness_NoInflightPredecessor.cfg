\* MUST FAIL: Witness_NoInflightPredecessor — token_on_complete 의 전건이
\* 실제로 도달한다: *이어진* 선행이 비행 중(발화·미완)인데 의존은 아직
\* 발화하지 않은 상태.
\* 이 상태가 도달 불가라면 token_on_complete 를 지워도 달라질 것이 없고
\* 그 삭제 실험은 조용히 통과한다. 일반적인 「둘이 동시에 비행 중」은
\* 이것을 대신하지 못한다 — *이어진 쌍*이어야 한다.
CONSTANTS
  NOps = 3
  NWaves = 2
  NAddr = 2
  DisabledGuards = {}
SPECIFICATION Spec
INVARIANT Witness_NoInflightPredecessor
