\* 가드 삭제 실험: "flush_drops_staging" — 수락된 flush 가 스테이징에 닿지 않는다(판정 T5 착지 전의 RTL). flush(임대 회전 ⑵)를 건넌 옛 LO 가 같은 번호의 HI 한 워드로 새 임대의 태그·V 와 함께 커밋된다. TLC 는 반드시 실패해야 한다.
CONSTANTS
  Parts = {p1, p2}
  Indices = {i1}
  Frames = {f1, f2}
  Junk = Junk
  Phantom = Phantom
  Refusal = "stall"
  StgAlt = "flush"
  BelowCap = FALSE
  DisabledGuards = {"flush_drops_staging"}
SPECIFICATION Spec
INVARIANT TypeOK
PROPERTY Prop_LoStagesOnly
PROPERTY Prop_HiCommits
PROPERTY Prop_MismatchRejected
PROPERTY Prop_UnstagedRejected
PROPERTY Prop_HiCommitWhole
PROPERTY Prop_ValidFromV
PROPERTY Prop_FlushClears
PROPERTY Prop_FlushScoped
PROPERTY Prop_FlushKeepsData
PROPERTY Prop_PhantomRejected
PROPERTY Prop_RsvRejected
PROPERTY Prop_RejectLoud
PROPERTY Prop_MclrClears
PROPERTY Prop_MclrZeroKeeps
PROPERTY Prop_MclrRsvRejected
PROPERTY Prop_MclrKeepsStall
PROPERTY Prop_RoRejected
PROPERTY Prop_FlushEndsStaging
PROPERTY Prop_EntPhantomRejected
