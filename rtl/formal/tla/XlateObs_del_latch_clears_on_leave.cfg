\* 가드 삭제 실험: "latch_clears_on_leave" — 떠날 때 래치를 비우지 않는다. 다음 요청(연속 전진으로 같은 에지에 들어오거나 거품 뒤에 들어온)이 앞 요청의 판정을 물려받아 미적중인데도 정지하지 않는다. TLC 는 반드시 실패해야 한다 (자기 속성 Prop_NoInheritedVerdict).
