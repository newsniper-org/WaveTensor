\* 짝 run — 위 run 의 대조군. "fair_grant" 를 지우고 같은 SpecShoveFair 로 돌린다.
\* TLC 는 **반드시 실패**해야 한다. 이것이 없으면 위 run 의 통과가 「Spec 이 부실해서」인지
\* 「가정이 실제로 하중을 옮겨서」인지 갈리지 않는다 (XlateStore.tla 23번과 같은 짝).
CONSTANTS
  NumProducers = 2
  Bits = {b1, b2}
  NoVal = NoVal
  D = 1
  DisabledGuards = {"fair_grant"}
SPECIFICATION SpecShoveFair
INVARIANT TypeOK
PROPERTY Prop_Progress
