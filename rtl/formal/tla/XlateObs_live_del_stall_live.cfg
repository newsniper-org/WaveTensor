\* 대비 (MUST PASS): obs_stall_live 삭제 — [0] 이 sticky 를 내도 폴링하는 호스트(HostSpec)는 정지한 요청을 하나하나 결국 떠나보낸다. obs_stall_live 는 채널 충분성의 가드가 아니라 정지 *사실*의 정확성(Prop_StatusStall)의 가드다. 원형(읽기 공정성 없는 HostSpec)에서는 말더듬 인공물로 FAIL 이었다 — 모델 머리 「발견」.
CONSTANTS
  Parts = {p1, p2}
  Vpns = {v1, v2}
  Frames = {f1, f2}
  NoPart = NoPart
  NoVpn = NoVpn
  NoFr = NoFr
  ObsNoStall = "latched"
  Pipe = "uniform"
  Wired = TRUE
  Alts = {}
  DisabledGuards = {"obs_stall_live"}
SPECIFICATION HostSpec
PROPERTY Prop_StallResolves
