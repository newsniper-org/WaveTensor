\* MUST FAIL: Prop_NoSilentLoss — 가드 삭제 실험: "stall_on_pending" · 깊이 D=2.
\* 가득 찬 출력 자원에 생산이 일어나 *뒤 슬롯*이 덮어써진다. 버스면(dat/vld)은 전혀
\* 변하지 않으므로 이 소실은 파라미터화 이전의 버스면 어휘 속성으로는 원리적으로
\* 보이지 않았다 — 「가득 참 → 정지」 재진술이 D >= 2 에서 하중을 받는다는 증명.
CONSTANTS
  NumProducers = 2
  Bits = {b1, b2}
  NoVal = NoVal
  D = 2
  DisabledGuards = {"stall_on_pending"}
SPECIFICATION Spec
INVARIANT TypeOK
PROPERTY Prop_NoSilentLoss
