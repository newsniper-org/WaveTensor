\* 형상 sweep — 연산 수 확장 (NOps = 4). 이어진 쌍과 잇지 않은 쌍이 각각 둘씩 공존한다.
\* MUST FAIL: Inv_OnlyTokenBlocks — §4.4.4 규범 3 그 자체.
\* 지우면 wave 번호가 게이트가 된다. 계약에 없는 순서를 기계가 강제한다.
\*
\* ⚠️ 이 삭제는 *교착*도 만든다 (모듈 머리). 그런데 이 run 의 판정은 교착에
\*    흔들리지 않는다 — 위반이 *초기 상태*에 있고, TLC 는 초기 상태를 전부
\*    생성·검사한 뒤에야 후계를 계산하기 때문이다. 우연이 아니라 구조다.
\*    교착 축은 MemOrder_del_wave_not_gating_stuck.cfg 가 따로 판정한다.
CONSTANTS
  NOps = 4
  NWaves = 2
  NAddr = 2
  DisabledGuards = {"wave_not_gating"}
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT Inv_OnlyTokenBlocks
