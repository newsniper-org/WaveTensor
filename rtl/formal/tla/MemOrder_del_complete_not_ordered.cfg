\* MUST FAIL: Inv_CompleteUngated — 완료(응답) 측 순서 부과.
\* 지우면 완료가 발화 순서에 결박된다 (응답 FIFO / in-order completion):
\* 늦게 발화한 연산은 먼저 발화한 미완 연산이 끝나기 전에 완료할 수 없다.
\* §4.4.4 규범 1이 게이트하는 것은 *발화*뿐이므로 완료를 붙잡는 것은 전부
\* 계약 밖이다 — §4.4.4 해설이 기각한 「메모리 측 재정렬」의 완료측 쌍둥이.
\*
\* ⚠️ 1차 판은 순서 어휘가 전부 발화 측이어서 이 결함형이 배터리 전체에
\*    비가시였다 — 이 기계는 나머지 불변식 전부와 두 반전 증인을 좋은
\*    모델과 똑같이 통과·반증시킨다 (README 교훈 ② — 모듈 머리).
\* 위반은 초기 상태가 아니라 *두 번째 발화 뒤*에 있다 — 전이 판별 run 이다.
\* 짝: MemOrder_pair_fire_order_freedom_lost.cfg (자유 소멸) ·
\*     MemOrder_pair_complete_order_axis.cfg (발화 순서 자유는 생존 — 국소성)
CONSTANTS
  NOps = 3
  NWaves = 2
  NAddr = 2
  DisabledGuards = {"complete_not_ordered"}
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT Inv_CompleteUngated
