\* MUST PASS — 짝(강건성): "approve" 배치에서는 승인 전 판정이 없어 Witness_NoEarlyJudgment 가 성립하고, 기저("delay")의 같은 witness cfg 는 반증된다 — 그 대비가 판정 위치를 실측 가능하게 한다. D14 확정 후 "approve" 는 규범 밖 배치의 강건성 검사다.
CONSTANTS
  Tags = {t1, t2}
  NResv = 2
  Delay = 1
  MaxStall = 1
  JudgePoint = "approve"
  NoStat = NoStat
  Clean = Clean
  DisabledGuards = {}
SPECIFICATION Spec
INVARIANT Witness_NoEarlyJudgment
