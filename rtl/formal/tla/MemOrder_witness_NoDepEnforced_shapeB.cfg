\* 형상 sweep — 연산 수 확장 (NOps = 4). 이어진 쌍과 잇지 않은 쌍이 각각 둘씩 공존한다.
\* MUST FAIL: Witness_NoDepEnforced — 이어진 쌍이 실제로 둘 다 완료된다.
\* 안 끝나면 Inv_ObservedOrder(관측 계약 — 완료 순서가 프로그램 순서와
\* 같다)가 한 번도 시험되지 않는다.
CONSTANTS
  NOps = 4
  NWaves = 2
  NAddr = 2
  DisabledGuards = {}
SPECIFICATION Spec
INVARIANT Witness_NoDepEnforced
