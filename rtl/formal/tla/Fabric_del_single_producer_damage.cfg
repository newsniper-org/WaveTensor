\* 가드 삭제 실험: "single_producer" — *피해* 쪽. TLC 는 **반드시 실패**해야 한다 — 두 값의 합집합이 어느 쪽도 아닌 값이 된다 (§2.3 함정). 전제 쪽(Fabric_del_single_producer.cfg)과 짝으로 읽는다: 전제가 깨지는 것과 피해가 나는 것은 *다른 사건*이고, 정본이 둘 다 적었으므로 둘 다 잰다.
CONSTANTS
  NumProducers = 2
  Bits = {b1, b2}
  NoVal = NoVal
  D = 1
  DisabledGuards = {"single_producer"}
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT Inv_MergeFaithful
