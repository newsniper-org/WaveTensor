\* MUST FAIL: Inv_OnlyTokenBlocks — 토큰 배선 오류의 *과대* 방향.
\* 기계가 프로그램이 건 것보다 *많이* 기다린다 (gateOn ⊋ Preds) → 과잉 게이팅.
\* _del_gate_matches_dep.cfg(과소) · _del_gate_matches_dep_stuck.cfg(역방향)
\* 와 *짝*이며, 셋을 함께 읽어야 「이 가드가 무엇을 지탱하는가」가 완결된다.
\* 배선은 초기 상태에서 정해지므로 위반도 초기 상태에 있다 — 정적 결함이므로
\* 그것이 정직한 형태다.
CONSTANTS
  NOps = 3
  NWaves = 2
  NAddr = 2
  DisabledGuards = {"gate_matches_dep"}
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT Inv_OnlyTokenBlocks
