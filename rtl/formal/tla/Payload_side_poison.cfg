\* MUST PASS — 좋은 모델(가드 전부 켬), 기저 형상, Tags 정제 축 중 poison 을 켠다 — Traces = {0} ·
\* Poisons = {0, 1}. 기저(Payload_base.cfg)의 짝 판이다 — 그쪽 머리가 한 축씩 켜는 근거를 든다.
\* poison 은 값마다 장치가 저작하므로 한 조각열 안에서 조각마다 다를 수 있다(1.4.4 poison 2항).
CONSTANTS
  NumTags = 2
  Runs = {r1, r2}
  Ctxs = {x1, x2}
  SlotCap = 2
  MaxSend = 4
  NoR = NoR
  NoT = NoT
  Traces = {0}
  Poisons = {0, 1}
  DisabledGuards = {}
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT Inv_ReassemblyExclusive
INVARIANT Inv_NoCrossWindow
INVARIANT Inv_RejectLoud
INVARIANT Inv_CapabilityNotMalformed
INVARIANT Inv_NoStaleRedeliver
INVARIANT Inv_EndIncompleteLoud
INVARIANT Inv_AbortLoud
INVARIANT Inv_AbortNotFault
INVARIANT Inv_AbortReachesKey
PROPERTY Prop_NoSilentOverwrite
