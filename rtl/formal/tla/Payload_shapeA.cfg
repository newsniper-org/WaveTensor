\* MUST PASS — 형상 sweep A (NumTags=3): 태그 축을 늘려도 좋은 모델이 통과한다 (§6.7).
\* Runs 는 이 sweep 의 축이 아니다 — ContextAbort(E.12) 착지 후 Runs=3 이 실측
\* 폭발해(15분+ 미완, 5.6M+ distinct) 2 로 되돌렸다 (2026-08-23 처분).
\* Ctxs=3 은 ASSUME Ctxs >= NumTags 가 강제한다. 증인·가드 삭제 실험은 전부
\* 기저 형상의 별도 cfg — 이 run 은 불변식·행위 속성만 본다.
\* SYMMETRY 근거는 Payload.tla 의 Symm 해설 (형상 sweep cfg 전용).
CONSTANTS
  NumTags = 3
  Runs = {r1, r2}
  Ctxs = {x1, x2, x3}
  SlotCap = 2
  MaxSend = 4
  NoR = NoR
  NoT = NoT
  Traces = {0}
  Poisons = {0}
  DisabledGuards = {}
SYMMETRY Symm
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT Inv_ReassemblyExclusive
INVARIANT Inv_NoCrossWindow
INVARIANT Inv_RejectLoud
INVARIANT Inv_CapabilityNotMalformed
INVARIANT Inv_NoStaleRedeliver
INVARIANT Inv_EndIncompleteLoud
INVARIANT Inv_AbortLoud
INVARIANT Inv_AbortNotFault
INVARIANT Inv_AbortReachesKey
PROPERTY Prop_NoSilentOverwrite
