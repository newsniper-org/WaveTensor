\* MUST PASS — 강건성: JudgePoint="approve" 는 D14 확정(판정 = 디코드 경계 · 실행 전)이 배제한 배치다. 규범 형상(기저 = "delay")이 아니라, 시간 게이트 없는 불변식이 판정 위치 선택에 자기지시적이지 않음을 재는 검사로 유지한다.
CONSTANTS
  Tags = {t1, t2}
  NResv = 2
  Delay = 1
  MaxStall = 1
  JudgePoint = "approve"
  NoStat = NoStat
  Clean = Clean
  DisabledGuards = {}
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT Inv_SamePathTrace
INVARIANT Inv_ResvOpaque
INVARIANT Inv_OutVerdictOnly
INVARIANT Inv_MalformedRejected
INVARIANT Inv_KindRealized
