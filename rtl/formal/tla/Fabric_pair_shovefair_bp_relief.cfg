\* 짝 run — "bp_relief" 를 지우되 Shove 에 공정성을 얹은 Spec. TLC 는 **반드시 통과**해야 한다.
\* 무엇을 말하는가: bp_relief 삭제가 FAB-6 을 깨뜨린다는 판정은 「막힌 생산자가 반드시
\* 규약을 어긴다고 가정하지 않는다」는 모델링 선택 위에 서 있다. 그 가정을 넣으면 배압이
\* 영구해도 모든 대기자가 loud fault 라는 처분을 받아 진행성이 성립한다. 정본 §2.6 은
\* Shove 의 공정성에 대해 아무 말도 하지 않으므로, 이 가정은 정본이 아니라 모델의 것이다.
\* 그 사실을 배터리 밖에 두면 판정의 근거가 숨는다.
CONSTANTS
  NumProducers = 2
  Bits = {b1, b2}
  NoVal = NoVal
  DisabledGuards = {"bp_relief"}
SPECIFICATION SpecShoveFair
INVARIANT TypeOK
PROPERTY Prop_Progress
