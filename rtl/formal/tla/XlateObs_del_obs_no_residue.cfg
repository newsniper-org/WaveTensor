\* 가드 삭제 실험: "obs_no_residue" — 정지 없는 관측이 끝난 정지의 포착값을 낸다 (ObsNoStall = latched — 갈래 (B) 의 잔재). TLC 는 반드시 실패해야 한다 (자기 속성 Prop_NoStallNoData).
CONSTANTS
  Parts = {p1, p2}
  Vpns = {v1, v2}
  NoPart = NoPart
  NoVpn = NoVpn
  ObsNoStall = "latched"
  Pipe = "uniform"
  Wired = TRUE
  DisabledGuards = {"obs_no_residue"}
SPECIFICATION Spec
INVARIANT TypeOK
PROPERTY Prop_NoStallNoData
PROPERTY Prop_StatusStall
PROPERTY Prop_StatusSticky
PROPERTY Prop_PartStalled
PROPERTY Prop_VpnStalled
PROPERTY Prop_ReadPure
