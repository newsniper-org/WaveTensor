\* MUST FAIL: Inv_AbortNotFault — 가드 삭제: abort_not_fault. 호스트의 의도된
\* 처분(문맥 소거)이 loud fault 로 접힌다 — 관측자에게 「기계 어딘가가
\* 잘못됐다」를 거짓으로 알린다 (E.12 2항 「소거는 fault 가 아니다」의 삭제
\* 실험 — capability_not_fault 와 같은 문체).
CONSTANTS
  NumTags = 2
  Runs = {r1, r2}
  Ctxs = {x1, x2}
  SlotCap = 2
  MaxSend = 4
  NoR = NoR
  NoT = NoT
  DisabledGuards = {"abort_not_fault"}
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT Inv_AbortNotFault
