\* MUST FAIL: Prop_StallResolves — 진행 짝: 래치 없는 판(verdict_latch 삭제) + 경쟁자 + 하류 배압(떠남 Depart 의 약한 공정성). 풀린 요청이 떠나기 전에 경쟁 커밋이 축출하고 호스트가 다시 채우는 라이브락 — 정지한 요청이 영영 떠나지 못한다 (결과 (d) 가 없으면 (h) 의 수렴이 무너진다).
CONSTANTS
  Parts = {p1, p2}
  Vpns = {v1, v2}
  Frames = {f1, f2}
  NoPart = NoPart
  NoVpn = NoVpn
  NoFr = NoFr
  ObsNoStall = "latched"
  Pipe = "uniform"
  Wired = TRUE
  Alts = {}
  DisabledGuards = {"verdict_latch"}
SPECIFICATION HostSpec
PROPERTY Prop_StallResolves
