\* MUST PASS — 형상 sweep B (SlotCap=3): 구간 길이 축을 늘려도 좋은 모델이 통과한다 (§6.7).
\* ContextAbort(E.12) 착지 후 이 형상도 실측 폭발했다 (구체 공간 1.6M+
\* distinct/5분에도 미완). 줄일 수 있는 비-sweep 축이 없어(NumTags·Runs 최소,
\* MaxSend = 2*SlotCap 이 ASSUME 하한) SYMMETRY 로 처분한다 (2026-08-23)
\* — 근거는 Payload.tla 의 Symm 해설 (형상 sweep cfg 전용).
CONSTANTS
  NumTags = 2
  Runs = {r1, r2}
  Ctxs = {x1, x2, x3}
  SlotCap = 3
  MaxSend = 6
  NoR = NoR
  NoT = NoT
  Traces = {0}
  Poisons = {0}
  DisabledGuards = {}
SYMMETRY Symm
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT Inv_ReassemblyExclusive
INVARIANT Inv_NoCrossWindow
INVARIANT Inv_RejectLoud
INVARIANT Inv_CapabilityNotMalformed
INVARIANT Inv_NoStaleRedeliver
INVARIANT Inv_EndIncompleteLoud
INVARIANT Inv_AbortLoud
INVARIANT Inv_AbortNotFault
INVARIANT Inv_AbortReachesKey
PROPERTY Prop_NoSilentOverwrite
