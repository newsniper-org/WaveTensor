\* MUST FAIL: Prop_FiredKeyClean — 같은 D2 이전 기계의 호스트 가시 귀결: trace 가 선 TAG1 이 수락·무장되면 발화가 trace 를 든 태그를 싣는다. E.12 6항은 소거 매칭 키에서 trace 를 빼고 스테이징의 그 비트를 0 으로 못박는다.
