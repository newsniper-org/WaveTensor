\* 증인 (HostSpec) — 반드시 실패: 진행 환경(관측면만 보는 호스트 + 경쟁자)에서 앞 스텝에 판정이 래치된 요청의 항목이 경쟁 커밋에 실제로 축출된다 — 좋은 모델의 진행 PASS 가 그 위험 없이 얻은 것이 아님을 보인다.
CONSTANTS
  Parts = {p1, p2}
  Vpns = {v1, v2}
  Frames = {f1, f2}
  NoPart = NoPart
  NoVpn = NoVpn
  NoFr = NoFr
  ObsNoStall = "latched"
  Pipe = "uniform"
  Wired = TRUE
  Alts = {}
  DisabledGuards = {}
SPECIFICATION HostSpec
INVARIANT Witness_NoEvictWhileLatched
