\* MUST PASS — 좋은 모델, *연산 수 확장* 형상 (NOps = 4).
\* NOps = 3 에서는 「이어진 쌍 하나 + 잇지 않은 연산 하나」밖에 못 만든다.
\* 넷이면 이어진 쌍과 잇지 않은 쌍이 *각각 둘씩* 공존할 수 있고,
\* 토큰 사슬의 이행 폐포(Closure)가 길이 2 를 넘는다.
CONSTANTS
  NOps = 4
  NWaves = 2
  NAddr = 2
  DisabledGuards = {}
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT Inv_DepRespected
INVARIANT Inv_ObservedOrder
INVARIANT Inv_OnlyTokenBlocks
INVARIANT Inv_CompleteUngated
INVARIANT Inv_NoCircularWait
