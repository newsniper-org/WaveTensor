\* 형상 sweep — 연산 수 확장 (NOps = 4). 이어진 쌍과 잇지 않은 쌍이 각각 둘씩 공존한다.
\* MUST FAIL: Witness_NoCompletion — *구성된* 기계에서 연산이 실제로 완료된다.
\* 완료가 일어나지 않으면 Inv_DepRespected · Inv_OnlyTokenBlocks 가 전부
\* 공허하게 참이 된다. 무구성 기계(dep = {})에서의 완료는 자명하므로
\* Configured 를 합취해 배제했다 (Route.tla Configured(s) 선례).
CONSTANTS
  NOps = 4
  NWaves = 2
  NAddr = 2
  DisabledGuards = {}
SPECIFICATION Spec
INVARIANT Witness_NoCompletion
