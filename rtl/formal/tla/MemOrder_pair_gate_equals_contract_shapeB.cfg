\* 형상 sweep — 연산 수 확장 (NOps = 4). 항진성 주장은 *형상마다* 재야 한다 —
\* 한 형상에서 항진이라는 사실이 다른 형상으로 자동 승계되지 않는다.
\* MUST PASS — *항진성의 선언.* 좋은 모델에서 기계가 기다리는 집합은
\* 계약이 요구하는 집합과 *정확히 같다* (부분집합이 아니라 등식).
\*
\* 이 run 이 통과한다는 것이 곧 「Inv_OnlyTokenBlocks 는 좋은 모델에서
\* 항진명제다」의 서명이다. 적대 검증이 별도 프로브 모듈로 측정했던 사실을
\* 배터리 안으로 들여온 것이며, 그래야 그 항진성이 *숨겨진 사실*이 아니라
\* *선언된 사실*이 된다. XlateStore.tla 23번 run(증인 유효성)과 같은 문체다.
\*
\* ⇒ Inv_OnlyTokenBlocks 를 단독으로 읽으면 아무것도 증명하지 않는다.
\*   그 내용은 전적으로 네 삭제 run(wave · addr · inflight · gate_over)과
\*   두 반전 증인에서 온다.
CONSTANTS
  NOps = 4
  NWaves = 2
  NAddr = 2
  DisabledGuards = {}
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT Inv_GateEqualsContract
