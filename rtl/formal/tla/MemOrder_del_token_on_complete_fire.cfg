\* MUST FAIL: Inv_DepRespected — 「완료된 뒤에만」의 *발화 시점* 얼굴.
\* 지우면 토큰이 선행의 발화 시점에 풀려, 의존 연산이 선행의 완료 전에
\* 발화한다 — fired[e2] ∧ ¬Done(e1), 발화 계약 위반. 완료가 한 번도
\* 일어나지 않은 실행에서 이미 깨진다 (실측: compIdx = ⟨0,0,0⟩ 반례).
\*
\* 위 MemOrder_del_token_on_complete.cfg(관측 계약)와 짝이다 — 한 가드가
\* 두 불변식을 지탱하면 run 이 둘 필요하다 (gate_matches_dep 의 방향별
\* run 과 같은 처분). 이 run 만 있으면 관측 순서 얼굴이 무판정으로 남고,
\* 저 run 만 있으면 발화 시점 얼굴이 무판정으로 남는다.
CONSTANTS
  NOps = 3
  NWaves = 2
  NAddr = 2
  DisabledGuards = {"token_on_complete"}
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT Inv_DepRespected
