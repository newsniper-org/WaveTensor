\* MUST PASS — 좋은 모델, *wave 축 확장* 형상 (NWaves = 3).
\* wave 번호가 셋이면 「이른 wave 가 늦은 wave 를 기다린다」의 사슬이 둘
\* 이상 겹칠 수 있다 — NWaves = 2 에서는 그 겹침이 표현되지 않는다.
CONSTANTS
  NOps = 3
  NWaves = 3
  NAddr = 2
  DisabledGuards = {}
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT Inv_DepRespected
INVARIANT Inv_ObservedOrder
INVARIANT Inv_OnlyTokenBlocks
INVARIANT Inv_CompleteUngated
INVARIANT Inv_NoCircularWait
