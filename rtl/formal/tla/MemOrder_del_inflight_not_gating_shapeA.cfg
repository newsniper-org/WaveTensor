\* 형상 sweep — wave 축 확장 (NWaves = 3). 축퇴 형상이 결함을 숨기지 않는지 본다.
\* MUST FAIL: Inv_OnlyTokenBlocks — §4.4.4 규범 2 「그 밖의 *모든* 쌍」.
\* 지우면 비행 중 연산이 하나라도 있는 동안 아무것도 발화하지 못한다 —
\* 단일 미결(single-outstanding) 메모리 파이프. 잇지 않은 *모든* 쌍에
\* 순서를 준다.
\*
\* ⚠️ 이 run 이 배터리에서 유일하게 Inv_OnlyTokenBlocks 를 *전이에서* 깨뜨린다.
\*    초기 상태에는 비행 중 연산이 없어 위반이 없고, 첫 Fire 뒤에 위반한다.
\*    1차 판에서는 이 불변식을 깨는 run 이 전부 초기 상태 위반이어서
\*    배터리 어디에서도 두 상태를 잇는 전이를 판별한 적이 없었다 —
\*    적대 검증 지적 4의 처분이 이 run 이다.
CONSTANTS
  NOps = 3
  NWaves = 3
  NAddr = 2
  DisabledGuards = {"inflight_not_gating"}
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT Inv_OnlyTokenBlocks
