\*
\* 가드 삭제: "flush_keeps_data" — flush 가 데이터까지 지우는 모델.
\* 이 run 은 **반드시 통과**해야 한다. 통과가 곧 증인의 유효성 증명이다:
\* 데이터를 지우면 Witness_DataSurvivesFlush 가 성립하므로, 좋은 모델에서
\* 그것이 반증됐다는 사실은 **데이터가 실제로 남기 때문**이지 증인이 부실해서가
\* 아니다. 두 run 을 짝으로 읽어야 HIU-2 의 통과가 자명하지 않음이 확정된다.
CONSTANTS
  Partitions = {q1, q2}
  Indices = {i1, i2}
  Tags = {t1, t2}
  NoPart = NoPart
  DisabledGuards = {"flush_keeps_data"}
SPECIFICATION Spec
INVARIANT Witness_DataSurvivesFlush
