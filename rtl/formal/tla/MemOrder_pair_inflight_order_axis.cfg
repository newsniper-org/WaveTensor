\* MUST FAIL: Witness_NoAddrInversion — *삭제가 축을 가린다는 확인.*
\* inflight_not_gating 을 지우면 *동시성*은 사라지지만 *순서 자유*는 남는다 —
\* 한 번에 하나씩 돌더라도 발화 순서 자체는 여전히 자유롭기 때문이다.
\*
\* 위 _pair_inflight_freedom_lost.cfg 와 짝으로 읽어야 두 결함형(동시성 소멸
\* vs 순서 고정)이 서로 다른 것임이 확정된다. 하나가 다른 하나를 함축한다면
\* 두 가드 중 하나는 장식이다.
CONSTANTS
  NOps = 3
  NWaves = 2
  NAddr = 2
  DisabledGuards = {"inflight_not_gating"}
SPECIFICATION Spec
INVARIANT Witness_NoAddrInversion
