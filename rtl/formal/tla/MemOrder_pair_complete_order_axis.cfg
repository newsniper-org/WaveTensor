\* MUST FAIL: Witness_NoAddrInversion — *삭제가 축을 가린다는 확인.*
\* complete_not_ordered 를 지워도(응답 FIFO) *발화 순서 자체*의 자유는 살아
\* 있다 — 완료가 발화 순서에 결박될 뿐, 발화 순서는 여전히 자유이므로
\* 프로그램 순서 반전은 여전히 도달한다.
\*
\* 이것이 없으면 위 _pair_fire_order_freedom_lost.cfg 의 MUST PASS 가
\* 「완료측 자유가 사라졌다」가 아니라 「모델이 통째로 죽었다」일 수도 있다.
\* 그리고 이것이 곧 두 반전 증인이 완료측 결박을 못 보는 이유의 형식이다 —
\* 반전 증인은 응답 FIFO 기계에서도 반증되므로 완료-발화 결박에 눈이 멀다.
CONSTANTS
  NOps = 3
  NWaves = 2
  NAddr = 2
  DisabledGuards = {"complete_not_ordered"}
SPECIFICATION Spec
INVARIANT Witness_NoAddrInversion
