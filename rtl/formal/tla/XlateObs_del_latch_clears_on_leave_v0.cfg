\* MUST FAIL: Prop_V0AfterEdgeMisses — 고정 속성의 반증: 떠날 때 비우지 않는 래치(latch_clears_on_leave 삭제)가 V=0 COMMIT 에지 뒤에 도착한 같은 (파티션, VPN) 요청에 앞 요청의 판정을 물려준다 — 에지 뒤 판정 조회가 적중한다.
CONSTANTS
  Parts = {p1, p2}
  Vpns = {v1, v2}
  Frames = {f1, f2}
  NoPart = NoPart
  NoVpn = NoVpn
  NoFr = NoFr
  ObsNoStall = "latched"
  Pipe = "uniform"
  Wired = TRUE
  Alts = {}
  DisabledGuards = {"latch_clears_on_leave"}
SPECIFICATION Spec
INVARIANT TypeOK
PROPERTY Prop_V0AfterEdgeMisses
