\* MUST PASS — 깊이 sweep 좋은 모델. 출력 자원 깊이 D=2 (버스면 1 + 뒤 슬롯 1) 에서도
\* 가드 전부 살아 있으면 전 속성이 성립한다. 계약이 깊이 무관 진술 「출력 자원이
\* 가득이면 생산은 정지한다 — 덮어쓰기는 없다」로 재진술된 뒤의 첫 D >= 2 검사.
\* 형상은 2·2 소형 — |Values| = 2^|Bits| 가 rest 에 곱해지므로 깊이 축만 벗긴다.
CONSTANTS
  NumProducers = 2
  Bits = {b1, b2}
  NoVal = NoVal
  D = 2
  DisabledGuards = {}
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT Inv_SingleValidProducer
INVARIANT Inv_MergeFaithful
INVARIANT Inv_ArrivalFromProducer
INVARIANT Inv_FaultVisible
PROPERTY Prop_NoSilentLoss
PROPERTY Prop_ArrivalHasSource
PROPERTY Prop_ConsumerQuiet
PROPERTY Prop_Progress
