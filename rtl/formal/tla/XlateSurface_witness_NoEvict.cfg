\* 증인 — 반드시 실패 (도달 가능성 증명). VIEW 없음 — 증인은 보조 넷을 상태로 읽는다. 상수는 XlateSurface_slots2.cfg 와 같다(파티션 1 · 칸 2 · VPN 3) — 그 PASS 가 축출이 실재하는 형상의 것임을 같은 상수로 보인다.
CONSTANTS
  Parts = {p1}
  Slots = {s1, s2}
