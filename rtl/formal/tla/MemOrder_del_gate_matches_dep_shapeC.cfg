\* 형상 sweep — 주소 축 확장 (NAddr = 3).
\* ⚠️ 이 가드만 NOps = 4 형상이 없다. gate_matches_dep 를 지우면 gateOn 이
\*    자유로워져 초기 상태 공간이 2^(NOps(NOps-1)/2) × 2^(NOps(NOps-1)) ×
\*    NWaves^NOps × NAddr^NOps 로 커지고 (GateCand 를 Ops \ {o} 로 연 뒤
\*    NOps = 4 에서 약 67M), *과소* 방향의 위반은 초기 상태에 없으므로
\*    TLC 가 그 초기 상태를 전부 생성한 뒤에야 첫 전이에 닿는다.
\*    같은 가드의 NOps = 4 형상은 *과대* 방향
\*    (MemOrder_del_gate_matches_dep_over_shapeB.cfg)이 판정한다 — 그쪽은
\*    위반이 초기 상태에 있어 열거 도중 끝난다. 자원 사실이지 판정 완화가
\*    아니다.
\* MUST FAIL: Inv_DepRespected — 토큰 배선 오류의 *과소* 방향.
\* 기계가 프로그램이 건 것보다 *적게* 기다린다 (gateOn ⊊ Preds) → 순서 붕괴.
\*
\* ⚠️ 이 가드는 방향이 셋이고 TLC 는 BFS 로 첫 방향만 찾고 멈춘다.
\*    *과대* 방향은 MemOrder_del_gate_matches_dep_over.cfg 가,
\*    *역방향*(배선 순환 교착)은 MemOrder_del_gate_matches_dep_stuck.cfg 가
\*    판정한다. 한 cfg 에 여러 불변식을 함께 걸면 나머지 방향이 영원히
\*    무판정으로 남는다.
\* ⚠️ CONSTRAINT ForwardWiredOnly — 역방향 배선의 서명은 *교착*이라, 무제약
\*    열거에서는 deadlock 보고가 이 run 의 전이 위반(깊이 1)을 가려 무판정이
\*    된다 (실측). 이 제약이 지우는 상태 중 Inv_DepRespected 를 위반하는
\*    것은 없다 — 판정 완화가 아니라 방향의 국소화다 (모듈의
\*    ForwardWiredOnly 주석 참조).
CONSTANTS
  NOps = 3
  NWaves = 2
  NAddr = 3
  DisabledGuards = {"gate_matches_dep"}
SPECIFICATION Spec
CONSTRAINT ForwardWiredOnly
INVARIANT TypeOK
INVARIANT Inv_DepRespected
