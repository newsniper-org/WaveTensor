\* MUST FAIL: Witness_NoFireOrderCoupling — 완료 순서가 발화 순서에서 실제로
\* 풀려 있다: *구성된* 기계에서(Configured /\ TokenEnforced) 잇지 않은 쌍이
\* 발화 순서를 거슬러 완료된다. 반증되지 않으면 관측 순서(compIdx)가 발화
\* 순서에 계약 밖 구조를 갖고 있는 것이다.
\*
\* ⚠️ 두 반전 증인(NoWaveInversion · NoAddrInversion)은 이것을 대신하지
\*    못한다 — 반전은 발화 순서 자체의 자유만으로 충족되므로, 완료가 발화
\*    순서에 결박된 기계(응답 FIFO)에서도 똑같이 반증된다 (실측 — 모듈
\*    머리). 이 증인만이 완료-발화 결박을 본다.
\* 짝: MemOrder_pair_fire_order_freedom_lost.cfg — complete_not_ordered 를
\*     지우면 이 증인이 *통과*한다 (= 그 자유가 사라졌다).
CONSTANTS
  NOps = 3
  NWaves = 2
  NAddr = 2
  DisabledGuards = {}
SPECIFICATION Spec
INVARIANT Witness_NoFireOrderCoupling
