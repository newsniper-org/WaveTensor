\* 가드 삭제 실험: "obs_part_stalled" — 정지 중 [15:8] 이 상수(파티션 값 0) — 오늘의 RTL 모양. TLC 는 반드시 실패해야 한다 (자기 속성 Prop_PartStalled).
CONSTANTS
  Parts = {p1, p2}
  Vpns = {v1, v2}
