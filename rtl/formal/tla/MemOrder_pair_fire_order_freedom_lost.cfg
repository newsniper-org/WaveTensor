\* MUST PASS — *완료 순서 자유가 사라졌다는 것의 형식.*
\* complete_not_ordered 를 지운 모델(응답 FIFO)에서
\* Witness_NoFireOrderCoupling 이 *통과*한다: 완료가 발화 순서에 결박돼
\* 잇지 않은 쌍이 더 이상 발화 순서를 거슬러 완료할 수 없다.
\*
\* 좋은 모델에서 MUST FAIL 인 증인이 여기서 MUST PASS 인 것이 짝의 내용이다.
\* 이 두 run 이 없으면 「complete_not_ordered 가 완료측 자유를 지탱한다」는
\* 진술이 서지 않는다 — 삭제로 불변식이 깨지는 것만으로는 *어느 자유가*
\* 사라졌는지 말할 수 없기 때문이다.
CONSTANTS
  NOps = 3
  NWaves = 2
  NAddr = 2
  DisabledGuards = {"complete_not_ordered"}
SPECIFICATION Spec
INVARIANT Witness_NoFireOrderCoupling
