\* MUST FAIL: Inv_ObservedOrder — 「완료된 뒤에만」의 *관측 순서* 얼굴.
\* 지우면 토큰이 선행의 *발화 시점*에 풀려 의존 연산이 선행보다 먼저
\* 완료할 수 있다 — Done(e2) ∧ ¬Done(e1), 관측 계약(EXT-6 문면) 위반.
\* Fire 와 Complete 를 한 동작으로 적었다면 이 결함형은 표현 불가였다.
\*
\* ⚠️ 1차 판은 여기에 두 줄짜리 Inv_DepRespected 를 걸고 「관측 계약(둘째
\*    줄)이 깨진다」고 적었다 — 실측으로 거짓. 반례는 완료가 한 번도 없는
\*    (compIdx = ⟨0,0,0⟩) 발화 계약 위반이었고, 관측 계약을 위반하는
\*    상태의 직전 상태가 언제나 더 얕은 BFS 깊이에서 발화 계약을 위반
\*    하므로 두 줄이 한 이름에 있는 한 둘째 줄은 구조적으로 판정 주체가
\*    될 수 없다. 그래서 관측 계약을 Inv_ObservedOrder 로 갈라 여기 걸었다.
\*    발화 시점 얼굴은 MemOrder_del_token_on_complete_fire.cfg 가 판정한다.
CONSTANTS
  NOps = 3
  NWaves = 2
  NAddr = 2
  DisabledGuards = {"token_on_complete"}
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT Inv_ObservedOrder
