\* 가드 삭제 실험: "stall_independent" — 채움 슬롯 저장 커밋이 미적중 정지 동안 막힌다. LiveSpec 아래 Prop_StallEnds 가 반드시 실패해야 한다 (CHECK_DEADLOCK FALSE — 막힌 판은 정지 상태가 막다른 곳이 되며, 판정은 데드락이 아니라 진행 속성의 반례여야 한다).
CONSTANTS
  Parts = {p1, p2}
  Slots = {s1}
  Vpns = {x1}
  Frames = {f1, f2}
  Junk = Junk
  NoVpn = NoVpn
  Phantom = Phantom
  Refusal = "stall"
  RefuseDomain = "addrstate"
  StgAlt = "flush"
  BelowCap = FALSE
  HostIndex = FALSE
  DisabledGuards = {"stall_independent"}
SPECIFICATION LiveSpec
CHECK_DEADLOCK FALSE
PROPERTY Prop_StallEnds
