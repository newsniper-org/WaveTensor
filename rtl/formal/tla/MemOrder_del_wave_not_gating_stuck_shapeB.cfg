\* 형상 sweep — 연산 수 확장 (NOps = 4). 이어진 쌍과 잇지 않은 쌍이 각각 둘씩 공존한다.
\* MUST FAIL: Inv_NoCircularWait — 과잉 게이팅의 *둘째* 대가.
\* wave 게이트는 색인 순서를 거스르는 유일한 게이트이므로 토큰 순서와
\* 어긋날 때 순환 대기를 만든다 — dep = {(1,2)} 인데 wave[1] > wave[2] 이면
\* op2 는 토큰 때문에, op1 은 wave 때문에 서로를 기다린다.
\*
\* 정본 §4.4.4 해설은 명시적 순서 의존의 대가를 「병렬성 손실」로만 적는다.
\* 실측된 대가는 *교착*이다 — 규범 3 이 왜 못박아야 하는지의 더 강한 근거이며
\* 정본 환류 대상이다.
CONSTANTS
  NOps = 4
  NWaves = 2
  NAddr = 2
  DisabledGuards = {"wave_not_gating"}
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT Inv_NoCircularWait
