# 이 줄이 실제 sbt 버전을 정한다. 컨테이너가 설치하는 `sbt` 패키지는 *런처*이며
# 이 스냅샷에서 그것은 2.0.6 이다 — 런처의 boot properties 가
# `version: ${sbt.version-read(sbt.version)[2.0.6]}` 이므로 2.0.6 은 기본값일
# 뿐이고 아래 값이 이긴다.
#
# ⚠️ 이 값은 .devcontainer/devcontainer.json 의 SBT_VERSION 과 **반드시 일치**한다.
#    scripts/lint_toolchain_pins.py 가 대조하며, 어긋나면 크게 실패한다.
sbt.version=1.12.15
