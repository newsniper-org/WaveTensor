#
# WaveTensor merge gate — 정본 부록 B.3 이 "CI 는 없다" 로 적은 항목의 해소.
#
# ⛔ 이 CI 가 **덮지 않는 것**을 먼저 적는다. 덮는 범위를 오해하면 이 파일이
#    "다 검사된다" 는 착각의 근거가 되고, 그것이 이 저장소가 반복해서 진
#    실패형이다.
#
#   · 검증 축 (c) — 타이밍 · 면적 · Fmax. **Vivado 는 호스트 전용**이다
#     (81 GB · 라이선스 · 2025.2 고정). 합성 gate 는 여기서 돌지 않으며,
#     이 CI 의 녹색은 면적·주파수에 대해 **아무것도 말하지 않는다.**
#   · ECP5 P&R — 같은 이유로 제외. 그리고 그것은 gate 가 아니라 MEASUREMENT 다.
#
# ∴ 여기서 도는 것: 축 (a) 형식 검증 · 축 (b) golden 대조 · 정적 검사.

name: gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 같은 ref 의 이전 실행은 취소한다 — 낡은 녹색이 남아 있으면 그것을 근거로
# 읽는 사람이 생긴다.
concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 정적 검사 — 컨테이너가 필요 없다. 빠르게 먼저 죽는다.
  # ---------------------------------------------------------------------------
  static:
    name: 정적 검사 (lint · 문서 · 훅)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # `make rtl-pins` 는 본 검사와 그 **음성 시험**(--self-test) 두 줄이다.
      # 셋(훅·CI·make)이 각각 스크립트를 직접 부르던 구조에서는 자기시험을
      # 한 자리에만 붙이면 나머지 둘이 자기시험 없이 돈다 — 선언처를 하나로.
      - name: 툴체인 핀 대조 (+ 음성 시험)
        run: make rtl-pins

      - name: 금지 용어 (마이크로코드)
        run: python3 scripts/lint_forbidden_terms.py

      - name: ISA-7 형상 독립성
        run: python3 scripts/lint_isa7_topology.py

      # 이름에 숫자를 적지 않는다 — 「기존 lint 16종」은 아무도 재지 않는
      # 손-유지 값이었다. 계수는 `scripts/lint_selftest_coverage.py` 의
      # 하한이 집행한다.
      - name: 정적 검사 일체 (make lint)
        run: make lint

      - name: 훅이 정본과 일치하는가
        run: |
          install -m 0755 scripts/hooks/pre-commit .git/hooks/pre-commit
          make hooks-check

      # 아래 둘은 정본(docs/wt64v1-architecture-guide/)의 자기 검사다.
      # typst 없이 grep 만으로 되는 축이라 여기서 돈다.
      - name: 정본 clean-room 위반 스캔 (0 이어야 한다)
        run: |
          cd docs/wt64v1-architecture-guide
          n=$(grep -REn "EHDecode|PE_Core|ISA_Decoder|Top_Core|FP_(StepSeq|Mul36|AddWide|Acc\w+|Train\w+|Fma\w+)|TENSOR_ALU|SIMD_ALU|ALU_Extended|dma_engine|\bpcid\b|\bNUM_PES\b|\bMAX_EH\b|\bTLB_ENTRIES\b|\bNUM_PARTITIONS\b|\bvirt_addr\b|\bdma_req\b|\w+\.(v|py|tcl|xdc):[0-9]+" chapters appendix main.typ | wc -l)
          echo "clean-room 위반: $n"
          test "$n" -eq 0

      - name: 정본 속성 수 대조 (색인 == 각 장 선언)
        run: |
          cd docs/wt64v1-architecture-guide
          idx=$(grep -c '^  \[\(ISA\|FAB\|HIU\|EXT\|SEC\)-' appendix/d-properties.typ)
          decl=$(grep -ho '#속성("[A-Z]*-[0-9]*"' chapters/*.typ | wc -l)
          echo "색인 $idx / 선언 $decl"
          test "$idx" -eq "$decl"

  # ---------------------------------------------------------------------------
  # 컨테이너 게이트 — 도구 버전이 증거이므로 devcontainer 정의 그대로 쓴다.
  # 러너에 도구를 직접 깔면 "어느 버전으로 쟀는가" 가 러너 이미지에 종속된다.
  # ---------------------------------------------------------------------------
  container:
    name: 시뮬 · 형식 게이트 (devcontainer)
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: devcontainer 이미지 빌드
        uses: docker/build-push-action@v6
        with:
          context: .devcontainer
          load: true
          tags: wavetensor-dev:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # ⛔ **툴체인 핀을 여기 적지 마라.** `--build-arg` 는 ARG 기본값을
          #    덮으므로 여기 적힌 값은 Dockerfile 의 핀보다 **세다** — 즉 이
          #    블록은 「참고용 사본」이 아니라 셋째 *선언처*였다.
          #
          #    2026-08-30 까지 여기에 핀 여덟(ALA_SNAPSHOT · TLA_VERSION ·
          #    TLA_BLAKE2B512 · COCOTB_VERSION · WITH_SBY · SBT/SCALA/
          #    SPINAL_VERSION)이 적혀 있었고, 그중 `TLA_BLAKE2B512` 가
          #    **죽은 값**(`4b2313f3…`)이었다. 2026-08-29 의 재핀(`cdc769d`)이
          #    Dockerfile 과 devcontainer.json 은 갱신했으나 이 파일을 몰랐다 —
          #    핀 lint 의 정의역에도 이 파일이 없었으므로 아무도 재지 않았다.
          #    상류를 다시 받아 실측(2026-08-30): 4,487,757 B / b2 `644f4331…`.
          #    ⇒ 그 값으로 빌드하면 Dockerfile §3 의 `b2sum -c` 가 반드시
          #    죽는다. GHA 층 캐시가 그 RUN 을 건너뛰는 동안만 가려져 있었다.
          #
          #    고치는 방법이 「값을 갱신한다」가 아닌 이유: 이 블록은 **정보를
          #    하나도 더하지 않는다.** build-push-action 은 이 저장소의
          #    Dockerfile 을 그대로 빌드하고, 넘기지 않은 ARG 는 그 파일의
          #    기본값을 쓴다. 지운 여덟 중 일곱은 Dockerfile 기본값과 글자
          #    그대로 같았다 — 순수 중복이었고, 중복의 유일한 효과가 이 사고다.
          #    devcontainer.json 이 사본을 갖는 것과는 다르다: 그쪽은 VS Code 가
          #    Dockerfile 을 읽기 **전에** 인자를 정하는 별개 소비자다.
          #
          #    `scripts/lint_toolchain_pins.py` 가 이 규율을 기계로 문다 —
          #    `.github/workflows/**` 의 build-arg 키는 아래 허용표에 없으면
          #    lint 가 죽는다. 목록이 아니라 **정의역 순회**로 잰다.
          #
          #    남는 둘은 **호스트 적응 값**이다. GitHub 러너의 작업 사용자가
          #    1001 이고, 컨테이너가 `-v $PWD:/workspace` 로 만든 파일의 소유자가
          #    여기 맞지 않으면 뒤 step 의 `git diff --exit-code` 가 권한으로
          #    깨진다. 재현성 축이 아니다 — UID 가 달라도 잰 값은 같다 (핀 lint 의
          #    `ARGS_NOT_COMPARED` 가 같은 이유로 이 둘을 대조에서 뺀다).
          #
          #    ⚠️ 아래 블록 스칼라 안에는 주석을 넣지 마라. `|` 의 내용은 문자열
          #    그대로 build-push-action 에 넘어가고 그것이 각 줄을 `--build-arg`
          #    한 개로 삼는다 — `#` 로 시작하는 줄이 어떻게 처리되는지 이쪽은
          #    **재지 않았다.** 설명은 전부 이 블록 밖(YAML 주석)에 둔다.
          build-args: |
            UID=1001
            GID=1001

      - name: 도구 자기보고 — "어느 버전으로 쟀는가"
        run: docker run --rm wavetensor-dev:ci sh -lc '~/wt-toolversions.sh'

      - name: SpinalHDL 생성이 최신인가 (재생성 후 바이트 비교)
        run: |
          docker run --rm -v "$PWD":/workspace -w /workspace wavetensor-dev:ci \
            sh -lc 'make rtl-gen'
          git diff --exit-code -- rtl/generated/ || {
            echo "⛔ rtl/generated/ 가 생성기와 어긋난다 — make rtl-gen 후 함께 커밋할 것"
            exit 1
          }

      - name: 생성물 verilator lint
        run: |
          docker run --rm -v "$PWD":/workspace -w /workspace wavetensor-dev:ci \
            sh -lc 'verilator --lint-only -Wall -Wno-fatal rtl/generated/*.sv'

      # 재구현 런타임 하네스 (#17). 위 두 step 이 「생성물이 최신인가 · lint 가
      # 통과하는가」를 재는 데 반해 이것은 **실제로 돌려서** 잰다 —
      # SEC-1 golden 정확 대조와 ISA-1/ISA-2 두-형상 등가.
      #
      # ⚠️ 이 step 의 초록이 뜻하지 않는 것 (하네스가 스스로 매 실행에 인쇄한다):
      #   · 투입 방향(E.5 명령 링) — RTL 에 회로가 0건이다. `Wt64Top` 의
      #     `io.instr` 에 `ready` 조차 없다. 잰 것은 명령 *제시* 이후의 경로뿐
      #   · ISA-1 의 형상 축 · ISA-2 의 자리 축 — 관측면이 아직 없다
      #   · 그 밖 미측정 9축 — `rtl/sim/README.md` 의 원장
      # 부록 D 에 ISA-1·ISA-2 를 「증명됨」으로 올리면 안 된다. 「부분」이
      # 정직한 지위다 (정본 §6.7 원칙 5 — 미측정은 통과가 아니다).
      - name: 재구현 런타임 하네스 (rtl-sim)
        run: |
          docker run --rm -v "$PWD":/workspace -w /workspace wavetensor-dev:ci \
            sh -lc 'make rtl-sim'

      - name: cocotb 회귀 (6 모듈)
        run: |
          for m in HIU ISA_Decoder ALU_Extended Top_Core Cluster Pod; do
            echo "::group::MOD=$m"
            docker run --rm -e COCOTB_RESULTS_FILE=/tmp/cocotb-results.xml \
              -v "$PWD":/workspace -w /workspace wavetensor-dev:ci \
              sh -lc "make MOD=$m"
            echo "::endgroup::"
          done

      # ⚠️ 위 step 은 **오라클을 덮어쓸 수 있다.** `WT_CAPTURE_TRUTH_TABLE=1`
      # 이 어디에서든(셸 프로파일 · 러너 env · make 래퍼) export 되면
      # `test_encwave_rtl_truth_table_differential` 이 대조 대신 **재캡처**로
      # 분기하고, 그 실행은 커밋된 오라클을 조용히 덮어쓴 뒤 **통과한다**
      # (`test_isa_decoder.py` 의 capture_mode 분기 — 재캡처는 검토된 의도적
      # 행위여야 하는데 그 「검토」가 오늘까지 사람의 기억에만 있었다).
      # 훅은 `isa/` 를 보지 않고, 여기에도 대조가 없었다 — 바로 위
      # `rtl/generated/` step 이 정확히 같은 형태를 이미 쓰고 있는데도.
      # 비용 ≈ 0. 이것이 이 축에서 가장 싸고 가장 실재하는 구멍이었다.
      - name: 오라클이 시뮬 실행으로 덮이지 않았는가 (isa/ 작업트리)
        run: |
          git diff --exit-code -- isa/ || {
            echo "⛔ cocotb 회귀가 isa/ 를 움직였다 — 재캡처는 CI 가 할 일이 아니다."
            echo "   WT_CAPTURE_TRUTH_TABLE 이 환경에 새어 있는지 확인하라."
            echo "   재캡처는 사람이 심의해 한 커밋으로 담는다"
            echo "   (WT_CAPTURE_TRUTH_TABLE=1 make MOD=ISA_Decoder + dv 범프 + 소비자 핀 재동기)."
            exit 1
          }

      - name: Cluster 이중 빌드 (FRAG_SLOTS=1 / 4)
        run: |
          docker run --rm -e COCOTB_RESULTS_FILE=/tmp/cocotb-results.xml \
            -v "$PWD":/workspace -w /workspace wavetensor-dev:ci \
            sh -lc 'make test-cluster-both'

      - name: 어셈블러 단위 테스트
        run: |
          docker run --rm -v "$PWD":/workspace -w /workspace wavetensor-dev:ci \
            sh -lc 'python3 -m unittest -q asm.test_wavetensor_asm'

      - name: TLA+ 형식 게이트 (16 run)
        run: |
          docker run --rm -v "$PWD":/workspace -w /workspace wavetensor-dev:ci \
            sh -lc 'sh proofs/tla/run.sh'

      # 재구현 선-formal 게이트. 모델이 아직 없으면 이 단계는 **실패한다** —
      # 그것이 의도다. 미측정은 통과가 아니다 (정본 §6.7 원칙 5).
      #
      # 2026-08-27: 단계 1 이 착지해 `continue-on-error` 를 걷어냈다.
      # 모델 12편 + run.sh 실재, 배터리 353 run. 유예가 필요했던 조건이
      # 사라졌으므로 유예도 사라진다 — 유예를 남겨 두면 그 다음부터는
      # 실패해도 초록으로 보인다.
      #
      # 후-formal 축은 별도 step 이 아니라 `make lint` 안에 있다
      # (lint_postformal · lint_witness_map · lint_tautology · lint_guard_map).
      # 전 태스크 재실행(`make rtl-postformal`, 약 51분)은 CI 예산 밖이라
      # 의도적으로 뺐다 — CI 가 재는 것은 **증거의 자기모순**이지 증명 자체가
      # 아니며, 그 구분은 lint_postformal 머리가 스스로 적는다.
      - name: 재구현 선-formal 게이트
        run: |
          docker run --rm -v "$PWD":/workspace -w /workspace wavetensor-dev:ci \
            sh -lc 'make rtl-formal' || {
              echo "::warning title=선-formal 미측정::rtl/formal/tla 에 모델이 없다. 통과가 아니라 미측정이다."
              exit 1
            }
